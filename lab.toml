# discovery-lab 工作区配置。预算和容量上限只能通过已批准的 harness 提案修改。

[env]
python = "/Users/max/codebase/.ml/.venv/bin/python"
assets = "assets"          # 工作区自有资产，不进 git
readonly_assets = [        # 只读复用的已下载权重/数据目录（机器:绝对路径），明细见 MACHINES.md 资产表
  "pc:/mnt/d/vscode_workplace/brainstorm/models",
  "pc:/home/pc/lab/assets/datasets",
]

# 每台机器一节；本机标识来自 ~/.config/lab/machine。python 用于运行实验和 tools/lab.py（≥3.11）。
[machines.mac]
role = "指挥台：规划、写代码、分析；不放数据、权重和缓存"
ssh = ""
repo = "/Users/max/codebase/coding_agent_repro"
python = "/Users/max/codebase/.ml/.venv/bin/python"
runs_root = ""   # 只跑 smoke，运行目录放在 topic 的 runs/ 下

[machines.pc]
role = "数据中心 + RTX 3060 单卡（Zotero 常驻约 6 GB，实际可用约 6 GB）"
ssh = "pc"
repo = "/home/pc/lab/coding_agent_repro"
python = "/home/pc/lab/envs/main/bin/python"
runs_root = "/home/pc/lab/runs"
assets = "/home/pc/lab/assets"
models = "/mnt/d/vscode_workplace/brainstorm/models"
hf_home = "/mnt/d/vscode_workplace/brainstorm/models/huggingface"
archive = "/mnt/d/lab-archive"

[machines.cluster]
role = "大算力：Slurm，A100/V100；遵循 bme-cluster"
ssh = "bme_login2"
transfer = "bme_xfer"
repo = "/public_bme/home/maxquan/Projects/coding_agent_repro"
python = "/public_bme/home/maxquan/envs/uv-python/cpython-3.12-linux-x86_64-gnu/bin/python3.12"   # 只用于 tools/lab.py；实验环境按 topic 用 conda/uv 另建
runs_root = "/public_bme/home/maxquan/Projects/runs"
datasets = "/public_bme/home/maxquan/Datasets"

[skill]
path = "/Users/max/codebase/research_plugins/Research_skills/research-discovery-lab"

[budget]
topic_compute_minutes = 30
download_gb_without_approval = 1

[limits]
hard = ["AGENTS.md", "CLAUDE.md"]   # 超出行数上限按 ERROR 处理，其余文件超限只给 WARN
moves = 40
summary_figures = 8
figure_kb = 1024

[limits.lines]
"AGENTS.md" = 120
"CLAUDE.md" = 25
"README.md" = 60
"INSIGHTS.md" = 150
"DISCOVERY.md" = 150
"PLAN.md" = 200
"SUMMARY.md" = 200
"REFLECTION.md" = 80
